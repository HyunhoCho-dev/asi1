<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASI1 - AI Companion by CTTechnologies</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>ASI1</h1>
                <span class="company">by CTTechnologies</span>
            </div>
            <nav class="nav">
                <button class="settings-btn" id="settingsBtn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="10" cy="10" r="3"/>
                        <path d="M12 10 L18 10 M2 10 L8 10 M10 2 L10 8 M10 12 L10 18"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <div class="ai-avatar">
                        <div class="pulse-ring"></div>
                        <div class="pulse-ring delay-1"></div>
                        <div class="pulse-ring delay-2"></div>
                        <div class="avatar-core"></div>
                    </div>
                    <h2 class="welcome-title">안녕, 나는 ASI1이야</h2>
                    <p class="welcome-subtitle">진짜 대화를 나누고 싶은 당신의 AI 친구</p>
                    <button class="start-btn" id="startBtn">
                        <span>대화 시작하기</span>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M8 3 L13 8 L8 13 M3 8 L13 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Chat Interface -->
            <div class="chat-interface hidden" id="chatInterface">
                <div class="chat-header">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span>ASI1이 준비되었어</span>
                    </div>
                    <div class="tools-used" id="toolsUsed"></div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        <div class="message-avatar">
                            <div class="avatar-small"></div>
                        </div>
                        <div class="message-content">
                            <p>안녕! 오늘 어떤 일이 있었어?</p>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="input-wrapper">
                        <button class="voice-btn" id="voiceBtn" title="마이크를 클릭해서 음성 대화 시작">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1 L12 15 M8 5 L8 11 C8 13.2 9.8 15 12 15 C14.2 15 16 13.2 16 11 L16 5"/>
                                <path d="M19 11 C19 15.4 15.4 19 11 19 M5 11 C5 15.4 8.6 19 13 19"/>
                                <path d="M12 19 L12 23 M8 23 L16 23"/>
                            </svg>
                            <span class="recording-indicator">●</span>
                        </button>
                        <textarea
                            id="messageInput"
                            class="message-input"
                            placeholder="메시지를 입력하거나 음성으로 말하세요..."
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" disabled>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2 L11 13 M22 2 L15 22 L11 13 M22 2 L2 9 L11 13"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="tip">팁: 마이크 버튼을 누르면 음성 대화 모드가 켜져 (자동으로 메시지 전송됨)</span>
                        <div class="character-count">
                            <span id="charCount">0</span> / 2000
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="modal hidden" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>설정</h3>
                <button class="close-btn" id="closeModalBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 L6 18 M6 6 L18 18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="apiKey">Groq API 키</label>
                    <input type="password" id="apiKey" placeholder="Groq API 키를 입력하세요">
                    <small><a href="https://console.groq.com" target="_blank">console.groq.com</a>에서 API 키를 발급받으세요 (무료)</small>
                </div>
                <div class="setting-group">
                    <label for="modelSelect">모델</label>
                    <select id="modelSelect">
                        <option value="openai/gpt-oss-120b">GPT-OSS 120B (추천)</option>
                        <option value="openai/gpt-oss-20b">GPT-OSS 20B (더 빠름)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>내장 도구</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="browserSearch" checked>
                            <span>웹 검색</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="codeInterpreter" checked>
                            <span>코드 실행</span>
                        </label>
                    </div>
                </div>
                <div class="setting-group">
                    <label>음성 설정</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="voiceEnabled" checked>
                            <span>음성 입력 활성화</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoSpeak" checked>
                            <span>답변 자동 읽기</span>
                        </label>
                    </div>
                </div>
                <div class="setting-group">
                    <label for="voiceSelect">음성 선택</label>
                    <select id="voiceSelect">
                        <option>Loading voices...</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="voiceRate">속도 <span id="voiceRateValue">1.0</span></label>
                    <input type="range" id="voiceRate" min="0.5" max="2.0" step="0.1" value="1.0" class="slider">
                </div>
                <div class="setting-group">
                    <label for="voicePitch">음높이 <span id="voicePitchValue">1.0</span></label>
                    <input type="range" id="voicePitch" min="0.5" max="2.0" step="0.1" value="1.0" class="slider">
                </div>
                <div class="setting-group">
                    <label for="voiceVolume">볼륨 <span id="voiceVolumeValue">1.0</span></label>
                    <input type="range" id="voiceVolume" min="0.0" max="1.0" step="0.1" value="1.0" class="slider">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelBtn">취소</button>
                <button class="btn-primary" id="saveBtn">저장</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>생각하는 중...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
